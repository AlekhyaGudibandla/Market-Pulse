version: '3.8'

services:
  # 1. Apache Kafka in KRaft Mode (Streaming Event Backbone)
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: marketpulse-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Neo4j Graph Database (Temporal Knowledge Graph)
  neo4j:
    image: neo4j:5.19.0
    container_name: marketpulse-neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      NEO4J_AUTH: neo4j/marketpulse_secret
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allow__csv: "apoc.*"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p marketpulse_secret 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. PostgreSQL 16 + pgvector (Transactional & Vector Index)
  postgres:
    image: pgvector/pgvector:pg16
    container_name: marketpulse-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: marketpulse_db
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: marketpulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketpulse -d marketpulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. Redis Cache (Deduplication & Distributed Locks)
  redis:
    image: redis:7.2-alpine
    container_name: marketpulse-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 5. MarketPulse Python FastAPI Intelligence Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: marketpulse-backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: marketpulse_secret
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      USE_EMBEDDED_KAFKA: "false"
      USE_EMBEDDED_GRAPH: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://marketpulse:marketpulse@postgres:5432/marketpulse_db
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 6. Next.js Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: marketpulse-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend

volumes:
  kafka_data:
  neo4j_data:
  postgres_data:
  redis_data:
